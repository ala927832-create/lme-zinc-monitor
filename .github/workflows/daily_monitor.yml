name: Daily LME Zinc Monitor

on:
  schedule:
    # UTC 時間每日 10:00 執行（台灣時間 18:00，週一至週五）
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      manual_cash_price:
        description: '手動輸入最新 LME Cash 現貨價 (USD/噸，例如 2850)。若留空則自動嘗試抓取網路數據。'
        required: false
        default: ''

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute LME Zinc Monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MANUAL_CASH_PRICE: ${{ github.event.inputs.manual_cash_price }}
        run: python main.py
